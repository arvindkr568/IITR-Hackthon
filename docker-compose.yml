version: '3.8'

services:
  coupon-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coupon_acceptance_app
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
